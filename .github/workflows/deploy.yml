name: Deploy HotelApp to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotelapp-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://hotelapp:dummy@localhost:5432/hotelapp
        run: npx prisma validate

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" <<'EOF'
            set -euo pipefail
            cd /opt/hotelapp
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.hetzner.yml up -d --build --remove-orphans
            docker compose -f docker-compose.hetzner.yml ps

            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null && \
                 curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
                echo "Services are healthy"
                exit 0
              fi
              echo "Waiting for services to be ready... (attempt $i/30)"
              sleep 2
            done

            echo "Services failed to become healthy"
            docker compose -f docker-compose.hetzner.yml ps
            docker compose -f docker-compose.hetzner.yml logs --tail=100 backend frontend
            exit 1
          EOF
